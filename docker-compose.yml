services:
  db:
    image: postgres:17
    container_name: embark-db
    environment:
      POSTGRES_USER: embark
      POSTGRES_PASSWORD: embark
      POSTGRES_DB: embark
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - ./data/hackathon-problem-1-holiday-package/data/catalog:/catalog:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embark -d embark"]
      interval: 2s
      retries: 30

  backend:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: embark-backend
    working_dir: /repo/backend
    # app/core/config.py resolves db/ and data/ from the repo root, so mount the whole repo
    volumes:
      - .:/repo
    environment:
      DATABASE_URL: postgresql://embark:embark@db:5432/embark
      UV_PROJECT_ENVIRONMENT: /venv  # keep the host's Windows .venv out of it
    command: uv run --frozen --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-bookworm-slim
    container_name: embark-frontend
    working_dir: /repo/frontend
    # vite.config.js reads the optional Google key from the repo's .env, so mount the whole repo
    volumes:
      - .:/repo
      - frontend_modules:/repo/frontend/node_modules  # keep the host's Windows node_modules out of it
    command: sh -c "npm ci --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_modules:
